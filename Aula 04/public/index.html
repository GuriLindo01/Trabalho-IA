<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula 04 - Agente com memória</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Barra lateral de conversas -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="nova" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Nova conversa
        </button>
      </div>

      <div class="sidebar-content">
        <span class="sidebar-label">Histórico</span>
        <ul id="lista-chats" class="chat-list">
          <li class="chat-item active">
            <span class="chat-title">Conversa atual</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="agent-badge">
          <span class="status-dot"></span>
          <span>Memória ativa</span>
        </div>
      </div>
    </aside>

    <!-- Fundo escuro ao abrir menu no mobile -->
    <div class="sidebar-overlay" id="overlay"></div>

    <!-- Área principal do chat -->
    <main class="main-area">
      <header class="topbar">
        <button id="toggle-sidebar" type="button" aria-label="Alternar barra lateral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
        <h1>Agente com memória</h1>
      </header>

      <div id="chat" aria-live="polite"></div>

      <div class="input-container">
        <form id="form">
          <input 
            id="pergunta" 
            aria-label="Sua mensagem" 
            placeholder="Envie uma mensagem para o agente..." 
            autocomplete="off" 
            required
          >
          <button id="enviar" type="submit">Enviar</button>
        </form>
        <span class="disclaimer">O agente lembra das mensagens anteriores desta conversa.</span>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
